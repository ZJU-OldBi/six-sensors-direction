<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气体传感器监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #0a1128;
            color: #00a8ff;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #1282a2;
            border-bottom: 2px solid #00a8ff;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #00a8ff;
            margin-bottom: 10px;
            color: #ffffff;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #87ceeb;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            background-color: #1282a2;
            color: #ffffff;
            border: 2px solid #00a8ff;
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            background-color: #00a8ff;
            color: #0a1128;
            box-shadow: 0 0 15px #00a8ff;
        }
        
        button:disabled {
            background-color: #333;
            color: #666;
            border-color: #666;
            cursor: not-allowed;
        }
        
        .sensor-selectors {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .sensor-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sensor-selector input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #00a8ff;
        }
        
        .sensor-selector label {
            font-size: 16px;
            color: #00a8ff;
        }
        
        .chart-container {
            background-color: #1c2b4a;
            border: 2px solid #00a8ff;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.1);
        }
        
        canvas {
            max-width: 100%;
            height: 400px !important;
        }
        
        .data-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .data-card {
            background-color: #1c2b4a;
            border: 2px solid #00a8ff;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.1);
        }
        
        .data-card h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #87ceeb;
        }
        
        .data-value {
            font-size: 2em;
            font-weight: bold;
            color: #00a8ff;
        }
        
        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .status.connected {
            color: #00a8ff;
        }
        
        .status.disconnected {
            color: #ff4757;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .sensor-selectors {
                flex-direction: column;
                align-items: center;
            }
            
            .data-display {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>气体传感器监控系统</h1>
            <div class="subtitle">实时数据采集与分析</div>
        </header>
        
        <div class="status disconnected" id="status">未连接</div>
        
        <div class="controls">
            <button id="connectBtn">连接串口</button>
            <button id="startBtn" disabled>开始接收</button>
            <button id="stopBtn" disabled>停止</button>
        </div>
        
        <div class="sensor-selectors">
            <div class="sensor-selector">
                <input type="checkbox" id="sensor1" checked>
                <label for="sensor1">传感器 1</label>
            </div>
            <div class="sensor-selector">
                <input type="checkbox" id="sensor2" checked>
                <label for="sensor2">传感器 2</label>
            </div>
            <div class="sensor-selector">
                <input type="checkbox" id="sensor3" checked>
                <label for="sensor3">传感器 3</label>
            </div>
            <div class="sensor-selector">
                <input type="checkbox" id="sensor4" checked>
                <label for="sensor4">传感器 4</label>
            </div>
            <div class="sensor-selector">
                <input type="checkbox" id="sensor5" checked>
                <label for="sensor5">传感器 5</label>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="dataChart"></canvas>
        </div>
        
        <div class="data-display">
            <div class="data-card">
                <h3>传感器 1</h3>
                <div class="data-value" id="value1">0.00</div>
            </div>
            <div class="data-card">
                <h3>传感器 2</h3>
                <div class="data-value" id="value2">0.00</div>
            </div>
            <div class="data-card">
                <h3>传感器 3</h3>
                <div class="data-value" id="value3">0.00</div>
            </div>
            <div class="data-card">
                <h3>传感器 4</h3>
                <div class="data-value" id="value4">0.00</div>
            </div>
            <div class="data-card">
                <h3>传感器 5</h3>
                <div class="data-value" id="value5">0.00</div>
            </div>
        </div>
    </div>
    
    <script>
        // 全局变量
        let port;
        let reader;
        let isReceiving = false;
        let isConnected = false;
        let chart;
        let data = [];
        let timestamps = [];
        let maxDataPoints = 100;
        let recordedData = [];
        
        // 颜色配置
        const colors = [
            'rgba(0, 168, 255, 1)',    // 传感器1：蓝色
            'rgba(135, 206, 235, 1)',  // 传感器2：亮蓝色
            'rgba(0, 255, 255, 1)',    // 传感器3：青色
            'rgba(255, 165, 0, 1)',    // 传感器4：橙色
            'rgba(255, 0, 0, 1)'       // 传感器5：红色
        ];
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('dataChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: [
                        {
                            label: '传感器 1',
                            data: [],
                            borderColor: colors[0],
                            backgroundColor: 'rgba(0, 255, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '传感器 2',
                            data: [],
                            borderColor: colors[1],
                            backgroundColor: 'rgba(0, 255, 255, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '传感器 3',
                            data: [],
                            borderColor: colors[2],
                            backgroundColor: 'rgba(255, 255, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '传感器 4',
                            data: [],
                            borderColor: colors[3],
                            backgroundColor: 'rgba(255, 165, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '传感器 5',
                            data: [],
                            borderColor: colors[4],
                            backgroundColor: 'rgba(255, 0, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: '时间',
                                color: '#00a8ff'
                            },
                            ticks: {
                                color: '#87ceeb'
                            },
                            grid: {
                                color: 'rgba(0, 168, 255, 0.1)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '数值',
                                color: '#00a8ff'
                            },
                            ticks: {
                                color: '#87ceeb'
                            },
                            grid: {
                                color: 'rgba(0, 168, 255, 0.1)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#00a8ff'
                            }
                        }
                    }
                }
            });
        }
        
        // 更新图表数据
        function updateChart(newData) {
            const now = new Date().toLocaleTimeString();
            
            // 添加时间戳
            timestamps.push(now);
            if (timestamps.length > maxDataPoints) {
                timestamps.shift();
            }
            
            // 更新每个传感器的数据
            for (let i = 0; i < 5; i++) {
                chart.data.datasets[i].data.push(newData[i]);
                if (chart.data.datasets[i].data.length > maxDataPoints) {
                    chart.data.datasets[i].data.shift();
                }
            }
            
            // 更新图表显示
            chart.update();
        }
        
        // 更新数据显示
        function updateDataDisplay(data) {
            for (let i = 0; i < 5; i++) {
                document.getElementById(`value${i+1}`).textContent = data[i].toFixed(2);
            }
        }
        
        // 处理串口数据
        async function processSerialData() {
            while (port.readable && (isReceiving || isConnected)) {
                try {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    // 处理接收到的数据
                    const lines = value.split('\r\n');
                    for (const line of lines) {
                        if (line.trim() === '') continue;
                        
                        const values = line.split(',').map(Number);
                        if (values.length === 5) {
                            // 转换数据格式
                            const processedData = [
                                ((values[0] - 2900) * 100) / 1100,
                                ((values[1] - 3400) * 100) / 550,
                                ((values[2] - 3400) * 100) / 550,
                                ((values[3] - 3400) * 100) / 550,
                                ((values[4] - 3400) * 100) / 550
                            ];
                            
                            // 更新图表和显示
                            updateChart(processedData);
                            updateDataDisplay(processedData);
                            
                            // 记录数据
                            if (isReceiving) {
                                recordedData.push([new Date().toISOString(), ...processedData]);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error reading serial data:', error);
                    break;
                }
            }
        }
        
        // 连接串口
        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                
                document.getElementById('status').textContent = '已连接';
                document.getElementById('status').className = 'status connected';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('startBtn').disabled = false;
                
                isConnected = true;
                
                // 准备读取数据
                reader = port.readable.getReader();
                // 开始处理数据
                processSerialData();
            } catch (error) {
                console.error('Error connecting to serial port:', error);
            }
        }
        
        // 开始接收数据
        function startReceiving() {
            isReceiving = true;
            recordedData = [];
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            processSerialData();
        }
        
        // 停止接收数据
        function stopReceiving() {
            isReceiving = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            // 确保数据保存功能正常工作
            setTimeout(saveData, 100);
        }
        
        // 保存数据为CSV
        function saveData() {
            if (recordedData.length === 0) return;
            
            // 创建CSV内容
            let csvContent = 'data:text/csv;charset=utf-8,';
            csvContent += '时间戳,传感器1,传感器2,传感器3,传感器4,传感器5\n';
            
            recordedData.forEach(row => {
                csvContent += row.join(',') + '\n';
            });
            
            // 创建下载链接
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `sensor_data_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.csv`);
            document.body.appendChild(link);
            
            // 触发下载
            link.click();
            document.body.removeChild(link);
        }
        
        // 处理传感器显示选择
        function setupSensorSelectors() {
            for (let i = 0; i < 5; i++) {
                const checkbox = document.getElementById(`sensor${i+1}`);
                checkbox.addEventListener('change', function() {
                    chart.data.datasets[i].hidden = !this.checked;
                    chart.update();
                });
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initChart();
            setupSensorSelectors();
            
            // 绑定按钮事件
            document.getElementById('connectBtn').addEventListener('click', connectSerial);
            document.getElementById('startBtn').addEventListener('click', startReceiving);
            document.getElementById('stopBtn').addEventListener('click', stopReceiving);
        });
    </script>
</body>
</html>
